name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar secreto JAMENDO_CLIENT_ID
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          if [ -z "$JAMENDO_CLIENT_ID" ]; then
            echo "::error::Falta el secreto JAMENDO_CLIENT_ID (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      # Genera solo los archivos de plataforma que falten (Gradle, MainActivity, íconos).
      # No sobrescribe lib/main.dart, pubspec.yaml ni AndroidManifest.xml.
      - name: flutter create (archivos faltantes)
        run: |
          flutter create --project-name vibra --org com.vibra --platforms android .
          rm -f test/widget_test.dart

      # Firma fija: sin esto cada build usa una clave distinta y Android no
      # deja actualizar la app encima de la versión anterior.
      - name: Clave de firma fija
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p ~/.android
          # Limpia saltos de línea de Windows u otros caracteres no base64
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -i "SHA-256"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build apk
        run: flutter build apk --release --dart-define=JAMENDO_CLIENT_ID=${{ secrets.JAMENDO_CLIENT_ID }}

      - name: Subir APK
        uses: actions/upload-artifact@v6
        with:
          name: vibra-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
